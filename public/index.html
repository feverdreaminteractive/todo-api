<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do API</title>
  <!-- Tailwind Play CDN -- fine for this non-graded demo frontend; a real app would use a build step. -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-gray-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold">To-Do API</h1>
      <span class="text-xs text-gray-400">Take-home skills assessment</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow border border-gray-200">
      <div class="p-4 flex flex-wrap items-center gap-2 border-b border-gray-200">
        <select id="filter-completed" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
          <option value="all">All</option>
          <option value="false">Active</option>
          <option value="true">Completed</option>
        </select>
        <select id="sort-by" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
          <option value="">Sort by…</option>
          <option value="dueDate">Due date</option>
          <option value="createdAt">Created</option>
          <option value="title">Title</option>
        </select>
        <select id="sort-order" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
        <!-- "Add todo" + row actions land in issue #19, once the create/edit/delete/complete
             wiring exists -- no point shipping a button that does nothing yet. -->
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Due date</th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
            </tr>
          </thead>
          <tbody id="todos-body" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>

      <div id="empty-state" class="hidden p-10 text-center text-sm text-gray-500">
        No todos yet.
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
