<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do API</title>
  <!-- Tailwind Play CDN -- fine for this non-graded demo frontend; a real app would use a build step. -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-gray-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold">To-Do API</h1>
      <span class="text-xs text-gray-400">Take-home skills assessment</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow border border-gray-200">
      <div class="p-4 flex flex-wrap items-center justify-between gap-2 border-b border-gray-200">
        <div class="flex flex-wrap items-center gap-2">
          <select id="filter-completed" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
            <option value="all">All</option>
            <option value="false">Active</option>
            <option value="true">Completed</option>
          </select>
          <select id="sort-by" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
            <option value="">Sort by…</option>
            <option value="dueDate">Due date</option>
            <option value="createdAt">Created</option>
            <option value="title">Title</option>
          </select>
          <select id="sort-order" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
        <button id="add-todo-btn" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">
          Add todo
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Due date</th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody id="todos-body" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>

      <div id="empty-state" class="hidden p-10 text-center text-sm text-gray-500">
        No todos yet — click "Add todo" to create one.
      </div>
    </div>
  </main>

  <!-- Create/edit modal (hand-rolled, not the Flowbite JS bundle -- one fewer CDN dependency for a quick demo frontend) -->
  <div id="todo-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-lg shadow w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modal-title" class="text-lg font-semibold text-gray-900">Add todo</h3>
        <button id="modal-close" type="button" class="text-gray-400 hover:text-gray-900 text-2xl leading-none">&times;</button>
      </div>
      <form id="todo-form" class="space-y-4">
        <div>
          <label for="field-title" class="block mb-1 text-sm font-medium text-gray-900">Title</label>
          <input id="field-title" type="text" required maxlength="200"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" />
        </div>
        <div>
          <label for="field-description" class="block mb-1 text-sm font-medium text-gray-900">Description</label>
          <textarea id="field-description" rows="3" maxlength="2000"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"></textarea>
        </div>
        <div>
          <label for="field-dueDate" class="block mb-1 text-sm font-medium text-gray-900">Due date</label>
          <input id="field-dueDate" type="date"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" />
        </div>
        <p id="form-error" class="hidden text-sm text-red-600"></p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="modal-cancel"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100">
            Cancel
          </button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
