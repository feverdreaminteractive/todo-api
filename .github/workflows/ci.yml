name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build

      - name: Start API server
        run: npm start &

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/todos > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: MCP smoke test
        run: npx tsx mcp/smoke-test.ts
